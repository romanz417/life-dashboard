<html lang="en">

<style>
  :root {
    color-scheme: dark;
    --bg:#0A0A0F; --card:#13131B; --card2:#1B1B26; --ink:#F5F0E4; --muted:#A8A294;
    --gold:#D4AF37; --gold-hi:#F3DE98; --gold-lo:#9C7A1C;
    --line:rgba(212,175,55,.20); --line2:rgba(255,255,255,.09);
    --accent:var(--gold); --good:var(--gold); --danger:#FF8A80;
    --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --goldgrad:linear-gradient(135deg,#F3DE98 0%,#D4AF37 52%,#9C7A1C 100%);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--sans); color:var(--ink); background:
    radial-gradient(900px 520px at 88% -8%, rgba(212,175,55,.11), transparent 60%),
    radial-gradient(760px 520px at -8% 108%, rgba(120,84,210,.10), transparent 60%),
    var(--bg); background-attachment:fixed; }
  header { max-width:760px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; padding:18px 16px; }
  .brand { display:flex; align-items:center; gap:10px; }
  h1 { font-size:1.15rem; margin:0; }
  header h1 { font-family:var(--serif); font-size:1.7rem; font-weight:700; letter-spacing:.05em; background:var(--goldgrad); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  main { max-width:760px; margin:0 auto; padding:0 16px 80px; }
  nav { display:flex; gap:8px; margin-bottom:18px; }
  nav button { flex:1; }
  button { font:inherit; padding:10px 14px; border-radius:12px; border:1px solid var(--line2); background:var(--card2); color:var(--ink); cursor:pointer; transition:filter .15s, border-color .15s; }
  button:hover { border-color:var(--line); }
  button.primary, nav button.on { background:var(--goldgrad); color:#17130A; border-color:transparent; font-weight:700; }
  button.primary:hover, nav button.on:hover { filter:brightness(1.07); }
  button.small { padding:5px 12px; font-size:.85rem; }
  button.danger { color:var(--danger); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--gold-hi); outline-offset:2px; }
  input[type=text], input[type=email], input[type=password], textarea, select {
    font:inherit; width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line2); background:rgba(255,255,255,.04); color:var(--ink);
  }
  input::placeholder, textarea::placeholder { color:#8E8878; }
  input[type=range], input[type=checkbox] { accent-color:var(--gold); }
  textarea { min-height:60px; resize:vertical; }
  .card { background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015)), var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 12px 32px rgba(0,0,0,.35); }
  .card > strong { font-family:var(--serif); font-size:1.35rem; font-weight:700; }
  .muted { color:var(--muted); font-size:.9rem; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > input[type=text] { flex:1; }
  .bar { height:10px; background:rgba(255,255,255,.09); border-radius:99px; overflow:hidden; margin:10px 0 4px; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-hi)); width:0; transition:width .3s; }
  .task { display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line2); }
  .task:first-of-type { border-top:0; }
  .task input { width:20px; height:20px; }
  .task.done span { text-decoration:line-through; color:var(--muted); }
  .task span { flex:1; }
  .area-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .area-head h3 { margin:0; font-family:var(--serif); font-size:1.4rem; font-weight:700; }
  .score { display:flex; align-items:center; gap:10px; margin:10px 0; }
  .score input { flex:1; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:9px 4px; border-top:1px solid var(--line2); font-size:.92rem; }
  th { border-top:0; color:var(--muted); font-weight:600; }

  /* ================= Sign-in screen ================= */
  #auth { position:fixed; inset:0; overflow:auto; background:#07070B; color:var(--ink); font-family:var(--sans); isolation:isolate; }
  .auth-wrap { min-height:100%; display:flex; flex-wrap:wrap; }

  /* left stage: the inspiration side */
  .stage { position:relative; isolation:isolate; overflow:hidden; flex:1.2 1 560px; padding:40px 48px; display:flex; flex-direction:column; justify-content:space-between; gap:32px; }
  .stage-bg { position:absolute; inset:-5%; z-index:-3; background:url(assets/bg-monaco.jpg) center 40%/cover no-repeat; animation:kb 42s ease-in-out infinite alternate; }
  .stage::before { content:""; position:absolute; inset:0; z-index:-2; background:
    linear-gradient(90deg, rgba(7,7,11,0) 55%, #07070B 100%),
    linear-gradient(180deg, rgba(7,7,11,.62) 0%, rgba(7,7,11,.40) 38%, rgba(7,7,11,.94) 100%); }
  .stage::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background-image:linear-gradient(rgba(212,175,55,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,55,.07) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse at 30% 35%, #000 0%, transparent 72%); mask-image:radial-gradient(ellipse at 30% 35%, #000 0%, transparent 72%); }

  .logo { display:flex; align-items:center; gap:12px; }
  .logo b { font-family:var(--serif); font-size:1.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-hi); }

  .hero { display:flex; flex-wrap:wrap; align-items:flex-end; gap:36px; }
  .portrait { position:relative; flex:none; width:clamp(200px, 21vw, 310px); aspect-ratio:4/5; border-radius:155px 155px 24px 24px; padding:3px; background:linear-gradient(160deg,#F3DE98,#9C7A1C 45%,#D4AF37 72%,#F3DE98); box-shadow:0 0 70px rgba(212,175,55,.30), 0 30px 60px rgba(0,0,0,.65); }
  .portrait img { display:block; width:100%; height:100%; object-fit:cover; border-radius:152px 152px 21px 21px; }
  .pill { position:absolute; left:50%; bottom:-14px; transform:translateX(-50%); white-space:nowrap; padding:8px 16px; border-radius:99px; font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-hi); background:rgba(10,10,15,.78); border:1px solid rgba(212,175,55,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .hero-text { flex:1 1 280px; min-width:0; display:flex; flex-direction:column; gap:18px; padding-bottom:18px; }
  .hero-text h2 { margin:0; font-family:var(--serif); font-weight:700; font-size:clamp(2.1rem, 3.7vw, 3.7rem); line-height:1.04; }
  .shine { background:linear-gradient(100deg,#F3DE98 0%,#D4AF37 30%,#FFF3C4 50%,#D4AF37 70%,#F3DE98 100%); background-size:230% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; animation:shine 8s linear infinite; }
  .reminder { display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:1px solid rgba(212,175,55,.35); max-width:440px; }
  .reminder small { font-size:.7rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); }
  .reminder blockquote { margin:0; font-family:var(--serif); font-style:italic; font-weight:500; font-size:clamp(1.25rem, 1.9vw, 1.65rem); line-height:1.3; color:#FFF6DC; }
  .focus { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .focus span { font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-right:4px; }
  .focus em { font-style:normal; font-size:.78rem; font-weight:700; padding:6px 12px; border-radius:99px; color:var(--gold-hi); border:1px solid rgba(212,175,55,.45); background:rgba(212,175,55,.08); }

  .vision { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  .tile { position:relative; overflow:hidden; border-radius:16px; aspect-ratio:4/3; border:1px solid rgba(212,175,55,.38); box-shadow:0 14px 30px rgba(0,0,0,.5); animation:float 7s ease-in-out infinite; }
  .tile:nth-child(2) { animation-delay:-2.3s; } .tile:nth-child(3) { animation-delay:-4.6s; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 45%, rgba(7,7,11,.85)); }
  .tile span { position:absolute; z-index:1; left:12px; bottom:10px; font-size:.68rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#FFF1C8; }

  /* right side: the gate */
  .gate { flex:1 1 440px; position:relative; padding:32px 24px; display:flex; align-items:center; justify-content:center; background:radial-gradient(520px 420px at 50% 45%, rgba(212,175,55,.11), transparent 70%), #07070B; }
  .auth-card { width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; padding:38px 32px 30px; border-radius:26px; background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border:1px solid rgba(212,175,55,.30); border-top-color:rgba(243,222,152,.75); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 0 0 1px rgba(255,255,255,.03) inset, 0 34px 80px rgba(0,0,0,.6), 0 0 90px rgba(212,175,55,.09); }
  .auth-date { font-size:.72rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); }
  .auth-card h2 { margin:-6px 0 0; font-family:var(--serif); font-size:2.5rem; font-weight:700; line-height:1.05; color:#FFF6DC; }
  .auth-sub { margin:-6px 0 4px; color:var(--muted); line-height:1.5; }
  .auth-card .field { display:flex; flex-direction:column; gap:7px; }
  .auth-card label { font-size:.72rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#E4DCC6; }
  .auth-card input { min-height:52px; padding:0 16px; border:1px solid rgba(212,175,55,.28); border-radius:13px; background:rgba(0,0,0,.38); color:var(--ink); }
  .auth-card input:focus-visible, .auth-card button:focus-visible { outline:2px solid var(--gold-hi); outline-offset:2px; }
  .pw { position:relative; }
  .pw input { padding-right:80px; }
  .pw button { position:absolute; right:6px; top:7px; min-height:38px; padding:0 14px; border:0; border-radius:9px; background:transparent; color:var(--gold-hi); font-weight:700; font-size:.82rem; }
  .auth-submit { min-height:54px; border:0; border-radius:13px; background:var(--goldgrad); color:#17130A; font-weight:800; font-size:1rem; letter-spacing:.03em; box-shadow:0 10px 30px rgba(212,175,55,.28); }
  .auth-submit:hover { filter:brightness(1.08); }
  .auth-submit:disabled { opacity:.6; cursor:wait; }
  .auth-links { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; }
  .auth-links .link { border:0; background:none; padding:10px 4px; min-height:44px; color:var(--gold-hi); font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  #authmsg { min-height:1.3em; font-size:.92rem; line-height:1.4; }
  #authmsg.err { color:#FF9B92; }
  #authmsg.ok { color:#86E3B5; }

  @media (max-width:900px) {
    .stage { flex-basis:100%; padding:26px 22px 34px; gap:22px; }
    .stage::before { background:linear-gradient(180deg, rgba(7,7,11,.55) 0%, rgba(7,7,11,.55) 55%, #07070B 100%); }
    .hero { gap:22px; align-items:center; }
    .portrait { width:128px; border-radius:64px 64px 18px 18px; }
    .portrait img { border-radius:61px 61px 15px 15px; }
    .pill, .vision, .focus { display:none; }
    .hero-text { padding-bottom:0; gap:12px; }
    .hero-text h2 { font-size:1.9rem; }
    .gate { flex-basis:100%; padding:8px 16px 40px; }
    .auth-card { padding:30px 22px 24px; }
  }

  @keyframes kb { from { transform:scale(1.02) translate(0,0); } to { transform:scale(1.13) translate(-1.6%,-1%); } }
  @keyframes shine { to { background-position:-230% 0; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .rise { opacity:0; animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:var(--d,0s); }
  @media (prefers-reduced-motion: reduce) {
    .stage-bg, .shine, .tile { animation:none; }
    .rise { animation:none; opacity:1; }
  }

  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--card2); color:var(--ink); border:1px solid var(--line); padding:10px 16px; border-radius:12px; display:none; max-width:90%; z-index:10; }
  .canvas-wrap { position:relative; height:240px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<div id="auth" hidden>
  <div class="auth-wrap">
    <section class="stage">
      <div class="stage-bg" aria-hidden="true"></div>

      <div class="logo rise">
        <svg width="38" height="38" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3.5l10.5 6v13L16 28.5l-10.5-6v-13z" stroke="#D4AF37" stroke-width="1.8" stroke-linejoin="round"/><path d="M11.5 17.5L16 13l4.5 4.5" stroke="#F3DE98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <b>Life Hack</b>
      </div>

      <div class="hero">
        <div class="portrait rise" style="--d:.15s">
          <img src="assets/portrait.jpg" width="800" height="1000" alt="Your portrait" fetchpriority="high">
          <div class="pill">Discipline · Focus · Consistency</div>
        </div>
        <div class="hero-text">
          <h2 class="rise" style="--d:.3s"><span class="shine">The life you are building starts today.</span></h2>
          <div class="reminder rise" style="--d:.45s">
            <small>Today&rsquo;s reminder</small>
            <blockquote id="dailyquote">Show up today for the person you are becoming.</blockquote>
          </div>
          <div class="focus rise" style="--d:.6s"><span>Current focus</span><em>Finances</em><em>Spiritual Life</em></div>
        </div>
      </div>

      <div class="vision rise" style="--d:.75s" aria-hidden="true">
        <div class="tile"><img src="assets/tile-yacht.jpg" alt="" loading="lazy"><span>Freedom</span></div>
        <div class="tile"><img src="assets/tile-villa.jpg" alt="" loading="lazy"><span>Legacy</span></div>
        <div class="tile"><img src="assets/tile-cafe.jpg" alt="" loading="lazy"><span>Peace</span></div>
      </div>
    </section>

    <section class="gate">
      <form id="authform" class="auth-card rise" style="--d:.2s" novalidate>
        <div class="auth-date" id="authdate"></div>
        <h2 id="authtitle">Welcome back</h2>
        <p class="auth-sub" id="authsub">Sign in to pick up where you left off.</p>
        <div class="field" id="emailrow">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
        </div>
        <div class="field">
          <label for="password" id="pwlabel">Password</label>
          <div class="pw">
            <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password">
            <button type="button" id="togglepw" aria-label="Show password">Show</button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="authsubmit">Sign in</button>
        <div class="auth-links">
          <button type="button" class="link" id="forgot">Forgot password?</button>
          <button type="button" class="link" id="switchmode">Create an account</button>
        </div>
        <div id="authmsg" role="alert" aria-live="polite"></div>
      </form>
    </section>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3.5l10.5 6v13L16 28.5l-10.5-6v-13z" stroke="#D4AF37" stroke-width="1.8" stroke-linejoin="round"/><path d="M11.5 17.5L16 13l4.5 4.5" stroke="#F3DE98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Life Hack</h1>
    </div>
    <button class="small" id="signout">Sign out</button>
  </header>
  <main>
    <nav>
      <button data-tab="today" class="on">Today</button>
      <button data-tab="areas">Life Areas</button>
      <button data-tab="progress">Progress</button>
    </nav>
    <section id="view-today"></section>
    <section id="view-areas" hidden></section>
    <section id="view-progress" hidden></section>
  </main>
</div>

<div id="toast"></div>

<script>
// ====== CONFIG: paste your Supabase values here ======
const SUPABASE_URL = 'https://civgwslhfoudpkbcxowl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_J5NwhYp_bUzl0Vj9XusVtQ_lZG7Mdo_';
// =====================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => ymd(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };

const DEFAULT_AREAS = [
  ['Health','💪',3,false],
  ['Relationships','❤️',4,false],
  ['Work & Career','💼',5,false],
  ['Finances','💰',1,true],
  ['Mental & Emotional Well-being','🧠',4,false],
  ['Personal Growth','📚',5,false],
  ['Spiritual Life','🙏',3,true],
  ['Fun & Recreation','🎉',3,false],
  ['Living Environment','🏡',5,false]
];

let state = { areas: [], tasks: [], checkins: [], tab: 'today', range: 30 };
let chart = null;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500);
}
async function run(promise) {
  const { data, error } = await promise;
  if (error) { toast(error.message); throw error; }
  return data;
}

// ---------- Daily inspiration (changes every day) ----------
const QUOTES = [
  'Small daily wins build the life your big dreams describe.',
  'Show up today for the person you are becoming.',
  'Discipline is simply choosing your future over your comfort.',
  'Your goals are watching what you do before breakfast.',
  'Progress is quiet. Keep going anyway.',
  'Every task you finish is a vote for the life you want.',
  'Rich habits first. Rich results follow.',
  "Today's effort is tomorrow's freedom.",
  'You are one consistent season away from a different life.',
  'Calm mind, clear plan, steady hands.',
  'Build in private. Let the results speak loudly.',
  'The version of you that wins is made of ordinary mornings.',
  'Protect your focus like your most valuable asset. It is.',
  'Money follows order. Start by tracking what you have.',
  'Pray, plan, then move.',
  'Be patient with the process and impatient with excuses.',
  'Done today beats perfect someday.',
  'Start with what you have. Improve it daily.',
  'Your future home, health and peace are all built today.',
  'Choose the hard hour now so you can enjoy the easy years later.',
  'Consistency turns ambition into a result.',
  'Win the morning, and the day follows.',
  'A clear goal and one daily step will outrun talent that waits.',
  'Gratitude for today. Hunger for tomorrow.',
  'You are not behind. You are building.',
  'Rest well, then return stronger.',
  'Be the quiet force others later call success.',
  'Make today count. It is the only one you can still edit.',
  'Faith opens the door. Action walks through it.',
  'Great lives are tracked, not hoped for.',
  'Same you. A better version, one check-in at a time.'
];
function paintDaily() {
  const now = new Date();
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  $('#dailyquote').textContent = QUOTES[dayOfYear % QUOTES.length];
  const h = now.getHours();
  const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  $('#authdate').textContent = greet + ' · ' + now.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
}

// ---------- Auth ----------
async function init() {
  if (SUPABASE_URL.startsWith('YOUR_')) {
    document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">Open index.html and paste your Supabase URL and anon key at the top of the script.</p>';
    return;
  }
  paintDaily();
  const recovering = /type=recovery/.test(location.hash);
  setMode(recovering ? 'recovery' : 'signin');
  if (recovering) showAuth();
  const { data: { session } } = await sb.auth.getSession();
  if (!recovering) session ? start() : showAuth();
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') { setMode('signin'); showAuth(); }
    if (event === 'PASSWORD_RECOVERY') { setMode('recovery'); showAuth(); }
  });
}
function showAuth() { $('#app').hidden = true; $('#auth').hidden = false; paintDaily(); }
async function start() {
  $('#auth').hidden = true; $('#app').hidden = false;
  await load(); render();
}

// ---- Sign-in screen logic ----
let authMode = 'signin';
const MODES = {
  signin:   { title: 'Welcome back', sub: 'Sign in to pick up where you left off.', btn: 'Sign in', sw: 'Create an account', pwl: 'Password', ac: 'current-password', email: true, forgot: true },
  signup:   { title: 'Create your account', sub: 'Start tracking the areas that matter most to you.', btn: 'Create account', sw: 'I already have an account', pwl: 'Password', ac: 'new-password', email: true, forgot: false },
  recovery: { title: 'Set a new password', sub: 'Choose a new password for your account.', btn: 'Save new password', sw: '', pwl: 'New password', ac: 'new-password', email: false, forgot: false }
};
function setMsg(text, isError) {
  const m = $('#authmsg'); m.textContent = text || ''; m.className = text ? (isError ? 'err' : 'ok') : '';
}
function setMode(mode) {
  authMode = mode; const c = MODES[mode];
  $('#authtitle').textContent = c.title; $('#authsub').textContent = c.sub;
  $('#authsubmit').textContent = c.btn; $('#pwlabel').textContent = c.pwl;
  $('#password').autocomplete = c.ac;
  $('#emailrow').hidden = !c.email; $('#forgot').hidden = !c.forgot;
  $('#switchmode').hidden = !c.sw; $('#switchmode').textContent = c.sw;
  setMsg('');
}
function busy(on) { const b = $('#authsubmit'); b.disabled = on; if (on) b.textContent = 'Please wait…'; else b.textContent = MODES[authMode].btn; }
$('#switchmode').onclick = () => setMode(authMode === 'signin' ? 'signup' : 'signin');
$('#togglepw').onclick = () => {
  const p = $('#password'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('#togglepw').textContent = show ? 'Hide' : 'Show';
  $('#togglepw').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
};
$('#forgot').onclick = async () => {
  const email = $('#email').value.trim();
  if (!email) return setMsg('Enter your email above first, then tap Forgot password.', true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  error ? setMsg(error.message, true) : setMsg('Password reset link sent. Check your email.');
};
$('#authform').addEventListener('submit', async e => {
  e.preventDefault(); setMsg('');
  const email = $('#email').value.trim(), password = $('#password').value;
  if (authMode !== 'recovery' && !email) return setMsg('Enter your email address.', true);
  if (password.length < 6) return setMsg('Your password needs at least 6 characters.', true);
  busy(true);
  try {
    if (authMode === 'signin') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return setMsg(error.message, true);
      start();
    } else if (authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) return setMsg(error.message, true);
      if (data.session) start(); else setMsg('Account created. Check your email to confirm, then sign in.');
    } else {
      const { error } = await sb.auth.updateUser({ password });
      if (error) return setMsg(error.message, true);
      history.replaceState(null, '', location.pathname);
      start();
    }
  } finally { busy(false); }
});
$('#signout').onclick = () => sb.auth.signOut();

// ---------- Data ----------
async function load() {
  let areas = await run(sb.from('areas').select('*').order('position').order('created_at'));
  if (!areas.length) {
    await run(sb.from('areas').insert(DEFAULT_AREAS.map(([name, icon, score, active], i) => ({ name, icon, score, active, position: i }))));
    areas = await run(sb.from('areas').select('*').order('position').order('created_at'));
  }
  state.areas = areas;
  state.tasks = await run(sb.from('tasks').select('*').order('created_at'));
  state.checkins = await run(sb.from('checkins').select('*').gte('day', daysAgo(100)));
}

// ---------- Rendering ----------
function render() {
  ['today', 'areas', 'progress'].forEach(t => $('#view-' + t).hidden = t !== state.tab);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  if (state.tab === 'today') renderToday();
  if (state.tab === 'areas') renderAreas();
  if (state.tab === 'progress') renderProgress();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });

function renderToday() {
  const day = todayStr();
  const done = new Set(state.checkins.filter(c => c.day === day).map(c => c.task_id));
  const activeAreas = state.areas.filter(a => a.active);
  const tasks = state.tasks.filter(t => activeAreas.some(a => a.id === t.area_id));
  const pct = tasks.length ? Math.round(tasks.filter(t => done.has(t.id)).length / tasks.length * 100) : 0;
  let html = `<div class="card"><strong>${new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' })}</strong>
    <div class="bar"><div style="width:${pct}%"></div></div><div class="muted">${pct}% of today's tasks done</div></div>`;
  if (!activeAreas.length) html += '<div class="card muted">No active areas. Turn some on in the Life Areas tab.</div>';
  activeAreas.forEach(a => {
    const ts = state.tasks.filter(t => t.area_id === a.id);
    html += `<div class="card"><div class="area-head"><h3>${esc(a.icon)} ${esc(a.name)}</h3></div>`;
    html += ts.length ? ts.map(t => `<label class="task ${done.has(t.id) ? 'done' : ''}">
        <input type="checkbox" data-task="${t.id}" ${done.has(t.id) ? 'checked' : ''}><span>${esc(t.title)}</span></label>`).join('')
      : '<div class="muted" style="margin-top:8px">No daily tasks yet. Add some in Life Areas.</div>';
    html += '</div>';
  });
  $('#view-today').innerHTML = html;
}
$('#view-today').addEventListener('change', async e => {
  const id = e.target.dataset.task; if (!id) return;
  const day = todayStr();
  try {
    if (e.target.checked) {
      const row = await run(sb.from('checkins').insert({ task_id: id, day }).select().single());
      state.checkins.push(row);
    } else {
      await run(sb.from('checkins').delete().eq('task_id', id).eq('day', day));
      state.checkins = state.checkins.filter(c => !(c.task_id === id && c.day === day));
    }
  } catch (_) {}
  renderToday();
});

function renderAreas() {
  let html = '';
  state.areas.forEach(a => {
    const ts = state.tasks.filter(t => t.area_id === a.id);
    html += `<div class="card" data-area="${a.id}">
      <div class="area-head">
        <h3>${esc(a.icon)} ${esc(a.name)}</h3>
        <label class="row muted"><input type="checkbox" data-act="active" ${a.active ? 'checked' : ''}> Active</label>
      </div>
      <div class="score"><span class="muted">Satisfaction</span>
        <input type="range" min="1" max="10" value="${a.score ?? 5}" data-act="score"><strong>${a.score ?? 5}</strong>/10</div>
      <textarea data-act="notes" placeholder="Notes, goals, details for this area...">${esc(a.notes)}</textarea>
      <div style="margin-top:10px">${ts.map(t => `<div class="task"><span>${esc(t.title)}</span>
        <button class="small danger" data-act="deltask" data-id="${t.id}">Remove</button></div>`).join('')}</div>
      <div class="row" style="margin-top:8px"><input type="text" placeholder="Add a daily task" data-new="task">
        <button class="small primary" data-act="addtask">Add</button></div>
      <div style="margin-top:10px;text-align:right"><button class="small danger" data-act="delarea">Delete area</button></div>
    </div>`;
  });
  html += `<div class="card"><strong>Add a new life area</strong>
    <div class="row" style="margin-top:8px"><input type="text" id="newarea" placeholder="e.g. Business, Family, Faith"><button class="primary" id="addarea">Add</button></div></div>`;
  $('#view-areas').innerHTML = html;
}
$('#view-areas').addEventListener('click', async e => {
  if (e.target.id === 'addarea') {
    const name = $('#newarea').value.trim(); if (!name) return;
    try {
      const row = await run(sb.from('areas').insert({ name, icon: '⭐', score: 5, active: false, position: state.areas.length }).select().single());
      state.areas.push(row);
    } catch (_) {}
    return renderAreas();
  }
  const act = e.target.dataset.act; if (!act) return;
  const card = e.target.closest('[data-area]'); const areaId = card?.dataset.area;
  try {
    if (act === 'addtask') {
      const input = card.querySelector('[data-new=task]'); const title = input.value.trim(); if (!title) return;
      const row = await run(sb.from('tasks').insert({ area_id: areaId, title }).select().single());
      state.tasks.push(row); renderAreas();
    } else if (act === 'deltask') {
      await run(sb.from('tasks').delete().eq('id', e.target.dataset.id));
      state.tasks = state.tasks.filter(t => t.id !== e.target.dataset.id);
      state.checkins = state.checkins.filter(c => c.task_id !== e.target.dataset.id); renderAreas();
    } else if (act === 'delarea') {
      if (!confirm('Delete this area and all its tasks and history?')) return;
      await run(sb.from('areas').delete().eq('id', areaId));
      const ids = state.tasks.filter(t => t.area_id === areaId).map(t => t.id);
      state.areas = state.areas.filter(a => a.id !== areaId);
      state.tasks = state.tasks.filter(t => t.area_id !== areaId);
      state.checkins = state.checkins.filter(c => !ids.includes(c.task_id)); renderAreas();
    }
  } catch (_) {}
});
$('#view-areas').addEventListener('change', async e => {
  const act = e.target.dataset.act; const card = e.target.closest('[data-area]'); if (!act || !card) return;
  const a = state.areas.find(x => x.id === card.dataset.area);
  const patch = act === 'active' ? { active: e.target.checked } : act === 'score' ? { score: +e.target.value } : act === 'notes' ? { notes: e.target.value } : null;
  if (!patch) return;
  try { await run(sb.from('areas').update(patch).eq('id', a.id)); Object.assign(a, patch); } catch (_) {}
  if (act === 'score') e.target.nextElementSibling.textContent = e.target.value;
});
$('#view-areas').addEventListener('input', e => {
  if (e.target.dataset.act === 'score') e.target.nextElementSibling.textContent = e.target.value;
});

function renderProgress() {
  $('#view-progress').innerHTML = `
    <div class="card"><div class="row" style="justify-content:space-between"><strong>Daily completion</strong>
      <select id="range" style="width:auto"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></div>
      <div class="canvas-wrap"><canvas id="chart"></canvas></div></div>
    <div class="card"><strong>By area</strong><table id="areatable"></table></div>`;
  $('#range').value = state.range;
  $('#range').onchange = e => { state.range = +e.target.value; renderProgress(); };

  const totalTasks = state.tasks.length;
  const labels = [], values = [];
  for (let i = state.range - 1; i >= 0; i--) {
    const d = daysAgo(i);
    labels.push(d.slice(5));
    const n = state.checkins.filter(c => c.day === d).length;
    values.push(totalTasks ? Math.round(n / totalTasks * 100) : 0);
  }
  if (chart) chart.destroy();
  if (window.Chart && Chart.defaults) {
    Chart.defaults.color = '#A8A294';
    Chart.defaults.borderColor = 'rgba(255,255,255,.08)';
    Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
  }
  chart = new Chart($('#chart'), {
    type: 'line',
    data: { labels, datasets: [{ label: 'Completion %', data: values, borderColor: '#D4AF37', backgroundColor: 'rgba(212,175,55,.14)', pointBackgroundColor: '#F3DE98', fill: true, tension: .3, pointRadius: state.range > 30 ? 0 : 3 }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
  });

  let rows = '<tr><th>Area</th><th>Rate</th><th>Streak</th><th>Score</th></tr>';
  state.areas.forEach(a => {
    const ids = new Set(state.tasks.filter(t => t.area_id === a.id).map(t => t.id));
    const cis = state.checkins.filter(c => ids.has(c.task_id));
    const from = daysAgo(state.range - 1);
    const done = cis.filter(c => c.day >= from).length;
    const rate = ids.size ? Math.round(done / (ids.size * state.range) * 100) : 0;
    const days = new Set(cis.map(c => c.day));
    let streak = 0, i = days.has(todayStr()) ? 0 : 1;
    while (days.has(daysAgo(i))) { streak++; i++; }
    rows += `<tr><td>${esc(a.icon)} ${esc(a.name)}</td><td>${ids.size ? rate + '%' : '-'}</td><td>${streak ? streak + ' day' + (streak > 1 ? 's' : '') : '-'}</td><td>${a.score ?? '-'}/10</td></tr>`;
  });
  $('#areatable').innerHTML = rows;
}

init();
</script>
</body>
</html>
